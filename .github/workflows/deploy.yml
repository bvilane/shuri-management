name: Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Cache Node.js modules
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/node_modules
          key: |
            ${{ runner.os }}-node_modules-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: |
            key: ${{ runner.os }}-nextjs

      - name: Install dependencies
        run: pnpm install

      - name: Remove pre-installed Pulumi
        run: |
          rm -rf ~/.pulumi
          sudo rm -f /usr/local/bin/pulumi*

      - name: Set up environment variables
        run: |
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_DEFAULT_ACCOUNT_ID=${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "GOOGLE_SERVICE_ACCOUNT_EMAIL=${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}" >> $GITHUB_ENV
          echo "GOOGLE_PRIVATE_KEY=${{ secrets.GOOGLE_PRIVATE_KEY }}" >> $GITHUB_ENV
          echo "GOOGLE_SHEET_ID=${{ vars.GOOGLE_SHEET_ID }}" >> $GITHUB_ENV
          echo "SMTP_NAME=${{ secrets.SMTP_NAME }}" >> $GITHUB_ENV
          echo "SMTP_MAIL=${{ secrets.SMTP_MAIL }}" >> $GITHUB_ENV
          echo "SMTP_REPLY_TO=${{ secrets.SMTP_REPLY_TO }}" >> $GITHUB_ENV
          echo "SMTP_HOST=${{ secrets.SMTP_HOST }}" >> $GITHUB_ENV
          echo "SMTP_PORT=${{ secrets.SMTP_PORT }}" >> $GITHUB_ENV
          echo "SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}" >> $GITHUB_ENV
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> $GITHUB_ENV
          echo "RECIPIENT_EMAIL=${{ vars.RECIPIENT_EMAIL }}" >> $GITHUB_ENV

      - name: Deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm run deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
