name: Supabase keep-alive

# Backup to the Vercel cron in vercel.json, and a visible run history for it.
# Calls the site's keep-alive route, which reads each Supabase table.
on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call keep-alive
        run: |
          curl -fsS --retry 3 --retry-delay 20 -m 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.shurimanagement.com/api/cron/keep-alive
